[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-looseleaf"
version = "2.2.0" # lockstep with the npm package
description = "LooseLeaf UI for Django: the CUBE CSS design system's stylesheet and scripts, template tags, and a form renderer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louis Stockton" }]
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]
keywords = ["django", "css", "cube-css", "design-system", "forms", "accessibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/StockoL/looseleaf-ui"
Repository = "https://github.com/StockoL/looseleaf-ui"
Issues = "https://github.com/StockoL/looseleaf-ui/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_looseleaf"]

# The example project is for local checks only and is not published.
[tool.hatch.build.targets.sdist]
include = ["src/django_looseleaf", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
