# Renders the Linux visual-regression baselines on the same image CI compares on.
# Run it from the Actions tab after an intended visual change, download the
# visual-baselines artifact into tests/browser/__screenshots__/, and commit it.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04 # must match the CI browser job
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/visual.spec.mjs --update-snapshots=all
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/browser/__screenshots__/*-linux.png
          if-no-files-found: error
